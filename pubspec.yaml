name: smart_search_app
description: "Apex AI, a fast contextual AI assistant for voice, search, and everyday actions."
publish_to: 'none'

version: 2.1.0+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  shared_preferences: ^2.5.5
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  flutter_markdown_plus: ^1.0.12
  path_provider: ^2.1.6
  crypto: ^3.0.7
  intl: ^0.20.2
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  google_sign_in: ^7.2.0
  # 7.4 makes Android respect pauseFor, which is required for complete
  # multi-word voice commands and conversational contact follow-ups.
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  speech_to_text_platform_interface: ^2.4.0

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/app_logo.png
    - assets/images/nexa_ambient_background_v2.webp
